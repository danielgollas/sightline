// One picker for both kinds of file. A document with a `scene` is a project;
// one with `nvrs` or `cameras` is a catalog to merge.
function importFile(onDone){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const doc=JSON.parse(rd.result);
        if(doc.scene){ loadDoc(doc); toast('Project loaded'); }
        else if(doc.nvrs||doc.cameras){
          CAT.addImported(doc);
          try{ localStorage.setItem(LS_CAT,JSON.stringify({nvrs:doc.nvrs||[],cameras:doc.cameras||[]})); }catch(e){}
          toast(`Catalog merged — ${(doc.nvrs||[]).length} NVRs, ${(doc.cameras||[]).length} cameras`);
        }
        else { toast('Not a project or catalog file'); return; }
        onDone&&onDone();
      }catch(e){ toast('Could not read that file'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------------- recording maths ---------------- */
/*
   Continuous recording is assumed. Bitrate is estimated from pixel rate:

       bitrate = w * h * fps * bpp

   The bits-per-pixel constants below are estimates for a typical outdoor
   scene, not a manufacturer figure - a static view compresses far better
   than a windy tree line. Motion-only recording would multiply the result by
   a duty factor this app does not model.
*/
const BPP={low:0.030, med:0.060, high:0.100};
const CODEC_MUL={'H.265':1, 'H.264':1.7, 'H.264+':1.3, 'H.265+':0.8};

const nvrOf=c=>nvrs.find(n=>n.id===c.nvr)||null;
// camera override, else its recorder's, else the project default
function inherit(c,field){
  if(c[field]!==undefined&&c[field]!==null)return {v:c[field],from:'camera'};
  const n=nvrOf(c);
  if(n&&n[field]!==undefined&&n[field]!==null)return {v:n[field],from:'nvr'};
  return {v:opts[field],from:'project'};
}
function bitrateOf(c){
  const S=specOf(c);
  const fps=inherit(c,'fps').v, q=inherit(c,'quality').v;
  const codec=(S.formats&&S.formats[0])||'H.265';
  const mul=CODEC_MUL[codec]||1;
  return S.resW*S.resH*fps*(BPP[q]||BPP.med)*mul/1e6;   // Mbps
}
function totals(){
  const live=cams.filter(c=>c.on);
  const mbps=live.reduce((s,c)=>s+bitrateOf(c),0);
  const storageGB=nvrs.filter(n=>n.on).reduce((s,n)=>s+((n.storageGB??specOfNvr(n).storageGB)||0),0);
  const cost=nvrs.reduce((s,n)=>s+(n.price||0),0)+cams.reduce((s,c)=>s+(c.price||0),0);
  const days=mbps>0?(storageGB*8*1000)/mbps/86400:0;
  // channels used vs available, so an over-subscribed recorder is visible
  const chans=nvrs.filter(n=>n.on).reduce((s,n)=>s+(specOfNvr(n).channels||0),0);
  return {nvrs:nvrs.length, cams:live.length, cost, mbps, storageGB, days, chans};
}
function specOfNvr(n){
  const e=n.catKey?CAT.byKey('nvrs',n.catKey):null;
  return e||n.spec||{};
}
const priceKnown=()=>cams.some(c=>c.price)||nvrs.some(n=>n.price);
/* ---------------- render ---------------- */
let coarse=false;
// What the 3D ray-cast overlays depend on. `playing` is in here because the PT
// animation deliberately drops them, and `sel` because both are filtered to
// the selected camera.
let _overlayKey='';
function overlayKey(){
  return [sceneKey(),
          cams.map(c=>`${c.on?1:0}${c.x},${c.y},${c.z},${c.a},${c.t}`).join(';'),
          opts.occ?1:0, opts.night?1:0, opts.tour?1:0,
          splatOn()?1:0, frusOn()?1:0, sel||'', playing?1:0, targetZ()].join('|');
}
function render(){
  // Transform matrices cache against this, so they are stale for at most one
  // frame and never need invalidating by hand on an edit.
  sceneGen++;
  T=fit();
  if(mode!=='3d')$('gl3d').style.display='none';
  if(mode==='pov'){
    cov.style.display='none'; svg.style.display='none'; v3.style.display='none';
    renderPOV();
  }
  else if(mode==='split'){
    const heat=drawMode()==='heat';
    cov.style.display=heat?'':'none'; svg.style.display=''; v3.style.display='none';
    if(heat)paintCoverage(coarse);
    drawPlan();
    renderPOV();
  }
  else if(mode==='2d'){
    const heat=drawMode()==='heat';
    cov.style.display=heat?'':'none'; svg.style.display=''; v3.style.display='none';
    if(heat)paintCoverage(coarse);
    drawPlan(); }
  else if(mode==='3d'){ cov.style.display='none'; svg.style.display='none';
    $('gl3d').style.display=''; v3.style.display='';
    GLON=render3DGL();
    // Frustum solids and splatter are ray-cast, not drawn: measured at ~30 ms
    // and ~100 ms respectively, which every property edit was paying. They
    // depend only on the geometry, the camera poses and the coverage options,
    // so cache them on exactly that.
    const k3=overlayKey();
    if(k3!==_overlayKey){
      splat=(!playing&&splatOn())?buildSplat():null;
      frusta=(!playing&&frusOn())?buildFrusta():null;
      _overlayKey=k3;
    }
    draw3d(); }
  if(!playing){
    const code=$('code');            // only present when Project is selected
    if(code)code.value=encode();
    updateStats();
    autosave();
  }
}
/* ---------------- interaction: plan ---------------- */
let drag=null;
function toW(e){const r=$('stage').getBoundingClientRect();
  return {x:sx(e.clientX-r.left), y:sy(e.clientY-r.top)};}
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=$('stage').getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const wpx=sx(mx), wpy=sy(my);
  zoom2=clamp(zoom2*(e.deltaY>0?0.9:1.111),0.25,8);
  const s2=baseScale()*zoom2;
  ctrX=wpx+(W/2-mx)/s2; ctrY=wpy+(H/2-my)/s2;
  render();
},{passive:false});

svg.addEventListener('pointerdown',e=>{
  const pv=e.target.closest('[data-vert],[data-mid]');
  if(pv&&selProp){
    if(pv.dataset.vert!==undefined){
      const i=+pv.dataset.vert;
      if((e.shiftKey||e.altKey)&&prop.length>3){prop.splice(i,1);render();list();return;}
      drag={type:'vert',i};
    } else {
      const i=+pv.dataset.mid;
      const [x,y]=prop[i],[nx,ny]=prop[(i+1)%prop.length];
      prop.splice(i+1,0,[Math.round((x+nx)/2*10)/10,Math.round((y+ny)/2*10)/10]);
      drag={type:'vert',i:i+1};
    }
    coarse=true; svg.setPointerCapture(e.pointerId); render(); list(); return;
  }
  const t=e.target.closest('[data-cam],[data-box]');
  if(!t){
    sel=null;selBox=null;selProp=false;
    drag={type:'pan',x:e.clientX,y:e.clientY,cx:ctrX,cy:ctrY};
    coarse=true; svg.setPointerCapture(e.pointerId); render(); list(); return;}
  if(t.dataset.cam){
    const c=cams.find(v=>v.id===t.dataset.cam); if(!c||!c.on)return;
    drag={type:t.dataset.mode,c}; sel=c.id; selBox=null;
  } else {
    const b=boxes.find(v=>v.id===t.dataset.box); if(!b)return;
    selBox=b.id; sel=null;
    if(t.dataset.corner)drag={type:'corner',b,k:t.dataset.corner};
    else if(t.dataset.grab==='move'){const p0=toW(e);drag={type:'boxmove',b,px:p0.x,py:p0.y,
      o:{x0:b.x0,y0:b.y0,x1:b.x1,y1:b.y1}};}
  }
  coarse=true; svg.setPointerCapture(e.pointerId); render(); list();
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.type==='pan'){
    const s2=baseScale()*zoom2;
    ctrX=drag.cx-(e.clientX-drag.x)/s2;
    ctrY=drag.cy-(e.clientY-drag.y)/s2;
    render(); return;
  }
  const p=toW(e);
  if(drag.type==='aim')drag.c.a=Math.round(norm(deg(Math.atan2(p.y-drag.c.y,p.x-drag.c.x))));
  else if(drag.type==='move'){drag.c.x=Math.round(p.x*10)/10;drag.c.y=Math.round(p.y*10)/10;}
  else if(drag.type==='boxmove'){
    const b=drag.b, ddx=Math.round((p.x-drag.px)*10)/10, ddy=Math.round((p.y-drag.py)*10)/10;
    b.x0=drag.o.x0+ddx; b.x1=drag.o.x1+ddx; b.y0=drag.o.y0+ddy; b.y1=drag.o.y1+ddy;
  }
  else if(drag.type==='vert'){
    prop[drag.i]=[Math.round(p.x*10)/10,Math.round(p.y*10)/10];
  }
  else if(drag.type==='corner'){
    const b=drag.b, k=drag.k;
    if(k[0]==='n')b.y0=Math.min(Math.round(p.y*10)/10,b.y1-1); else b.y1=Math.max(Math.round(p.y*10)/10,b.y0+1);
    if(k[1]==='w')b.x0=Math.min(Math.round(p.x*10)/10,b.x1-1); else b.x1=Math.max(Math.round(p.x*10)/10,b.x0+1);
  }
  render();
});
['pointerup','pointercancel'].forEach(v=>svg.addEventListener(v,()=>{
  if(drag){drag=null;coarse=false;render();list();}}));

/* ---------------- interaction: 3D ---------------- */
// Screen pixels per world foot of height, at this occluder's position, under
// whichever projection is live. Probing the projection keeps the GL and SVG
// fallback paths honest without either needing to know about the other.
function pxPerFootAt(b){
  const wm=worldM(b);
  const c=TX.xformPt(wm,[(b.x0+b.x1)/2,(b.y0+b.y1)/2,(zmin(b)+zmax(b))/2]);
  const a=proj(c[0],c[1],c[2]), z=proj(c[0],c[1],c[2]+1);
  const px=Math.abs(z.y-a.y);
  return px>0.05?px:1;             // degenerate head-on view: fall back to 1:1
}
let orbit=null, faceDrag=null;
v3.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-box]');
  if(t){
    const b=boxes.find(v=>v.id===t.dataset.box);
    if(b){
      const was=selBox===b.id;
      selBox=b.id; sel=null;
      if(t.dataset.surf)
        faceDrag={b,surf:t.dataset.surf,idx:t.dataset.edge.split(',').map(Number),
          y0:e.clientY,v0:b[t.dataset.surf].slice()};
      else if(was&&t.dataset.face)
        faceDrag={b,axis:t.dataset.face,y0:e.clientY,
          v0:t.dataset.face==='top'?b.zt.slice():
             t.dataset.face==='base'?b.zb.slice():b[t.dataset.face]};
      v3.setPointerCapture(e.pointerId); render(); list(); return; }
  }
  const wantPan=e.shiftKey||e.button===1||e.button===2;
  orbit={mode:wantPan?'pan':'orbit',x:e.clientX,y:e.clientY,az,elv,px:panX,py:panY};
  v3.style.cursor=wantPan?'grabbing':'move';
  v3.setPointerCapture(e.pointerId);
});
v3.addEventListener('contextmenu',e=>e.preventDefault());
v3.addEventListener('pointermove',e=>{
  if(faceDrag){
    // Pixels to feet, measured from the projection actually in use rather than
    // assumed. Under the perspective GL view the scale depends on how far the
    // handle is from the eye, so a fixed orthographic factor made a roof edge
    // track slower or faster than the pointer depending on the orbit.
    const d=-(e.clientY-faceDrag.y0)/pxPerFootAt(faceDrag.b);
    const b=faceDrag.b, ax=faceDrag.axis;
    if(faceDrag.surf){
      const arr=faceDrag.v0.slice();
      faceDrag.idx.forEach(i=>arr[i]=Math.round((faceDrag.v0[i]+d)*4)/4);
      if(faceDrag.surf==='zt')b.zt=arr.map((v,i)=>Math.max(v,b.zb[i]+.15));
      else b.zb=arr.map((v,i)=>Math.min(v,b.zt[i]-.15));
      render(); return;
    }
    if(ax==='top'||ax==='base'){
      const key=ax==='top'?'zt':'zb';
      const src=(faceDrag.v0&&faceDrag.v0.length)?faceDrag.v0:b[key];
      const arr=src.map(v=>Math.round((v+d)*4)/4);
      if(key==='zt')b.zt=arr.map((v,i)=>Math.max(v,b.zb[i]+.15));
      else b.zb=arr.map((v,i)=>Math.min(v,b.zt[i]-.15));
      render(); return;
    }
    let v=Math.round((faceDrag.v0+d)*2)/2;
    if(ax==='x1')b.x1=Math.max(v,b.x0+1);
    else if(ax==='x0')b.x0=Math.min(v,b.x1-1);
    else if(ax==='y1')b.y1=Math.max(v,b.y0+1);
    else if(ax==='y0')b.y0=Math.min(v,b.y1-1);
    render(); return;
  }
  if(!orbit)return;
  if(orbit.mode==='pan'){
    panX=orbit.px+(e.clientX-orbit.x);
    panY=orbit.py+(e.clientY-orbit.y);
  } else {
    az=orbit.az+(e.clientX-orbit.x)*0.35;
    elv=clamp(orbit.elv+(e.clientY-orbit.y)*0.28,6,86);
  }
  if(GLON)render3DGL();
  draw3d();
});
['pointerup','pointercancel'].forEach(v=>v3.addEventListener(v,()=>{
  if(faceDrag){faceDrag=null;list();}
  orbit=null; v3.style.cursor=''; render();}));
v3.addEventListener('wheel',e=>{e.preventDefault();
  const r=$('stage').getBoundingClientRect();
  const mx=e.clientX-r.left-W/2-panX, my=e.clientY-r.top-H/2-panY;
  const z0=zoom; zoom=clamp(zoom*(e.deltaY>0?0.93:1.075),0.25,6);
  const k=zoom/z0;
  panX-=mx*(k-1); panY-=my*(k-1);
  if(GLON)render3DGL();

/* ---------------- scene tree ---------------- */
/*
   NVRs own cameras (a wiring relationship: channels, storage, cost).
   Occluders nest spatially - a child inherits its parent's transform.
   Both sections collapse; the collapsed set is remembered per node id.
*/
let collapsed=new Set();
let selProject=false;
const isOpen=id=>!collapsed.has(id);
function toggleNode(id){ collapsed.has(id)?collapsed.delete(id):collapsed.add(id); renderTree(); }

// One selection across four kinds of entity, so the property editor only ever
// has one thing to render.
function select(kind,id){
  sel=null; selBox=null; selProp=false; selNvr=null; selProject=false;
  if(kind==='cam')sel=id;
  else if(kind==='box')selBox=id;
  else if(kind==='nvr')selNvr=id;
  else if(kind==='prop')selProp=true;
  else if(kind==='project')selProject=true;
  render(); list();
}
const selKind=()=> sel?'cam' : selBox?'box' : selNvr?'nvr' : selProp?'prop' : selProject?'project' : null;

const mk=(tag,cls,txt)=>{const e=document.createElement(tag); if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt; return e;};

function row({label,meta,selected,dot,on,onSelect,onEye,indent,twisty,onTwisty}){
  const r=mk('div','trow'+(selected?' sel':'')+(on===false?' off':''));
  if(dot)r.style.setProperty('--dot',dot);
  r.style.paddingLeft=(6+(indent||0)*13)+'px';
  const tw=mk('span','tw',twisty===undefined?'':(twisty?'▾':'▸'));
  if(twisty!==undefined){ tw.style.cursor='pointer';
    tw.onclick=e=>{e.stopPropagation(); onTwisty&&onTwisty();}; }
  r.append(tw);
  if(dot){ const d=mk('span','dot'); d.style.background=dot; r.append(d); }
  r.append(mk('span','nm',label));
  if(meta)r.append(mk('span','mt',meta));
  if(onEye){
    const b=mk('button','eye',on?'●':'○');
    b.onclick=e=>{e.stopPropagation(); onEye();};
    r.append(b);
  }
  r.onclick=onSelect;
  return r;
}
function section(title,count,onAdd,openKey,body){
  const wrap=mk('div','tsec');
  const h=mk('div','thead');
  h.append(mk('span','tw',isOpen(openKey)?'▾':'▸'), mk('span',null,title), mk('span','cnt','· '+count));
  h.onclick=()=>toggleNode(openKey);
  if(onAdd){
    const b=mk('button','tadd','+');
    b.title='Add';
    b.onclick=e=>{e.stopPropagation(); onAdd();};
    h.append(b);
  }
  wrap.append(h);
  if(isOpen(openKey))body(wrap);
  return wrap;
}

function renderTree(){
  const pane=$('treepane'); pane.textContent='';

  // project root
  pane.append(row({label:'Project', meta:opts.night?'night':'day',
    selected:selProject, indent:0, onSelect:()=>select('project')}));

  // ---- NVRs, each with its cameras ----
  pane.append(section('NVRs',nvrs.length,()=>pickNvr(),'sec-nvr',wrap=>{
    if(!nvrs.length){
      const e=mk('div','note','No recorder yet. Add one to hang cameras off it.');
      e.style.padding='2px 12px 6px'; wrap.append(e);
    }
    nvrs.forEach(n=>{
      const kids=cams.filter(c=>c.nvr===n.id);
      const S=specOfNvr(n);
      const over=S.channels&&kids.length>S.channels;
      const r=row({label:n.name,
        meta:`${kids.length}/${S.channels||'?'}`,
        selected:selNvr===n.id, on:n.on!==false, indent:1,
        twisty:isOpen(n.id), onTwisty:()=>toggleNode(n.id),
        onSelect:()=>select('nvr',n.id),
        onEye:()=>{n.on=n.on===false;render();list();}});
      if(over)r.querySelector('.mt').style.color='var(--warn)';
      const add=mk('button','tadd','+');
      add.title='Add a camera to this recorder';
      add.onclick=e=>{e.stopPropagation(); pickCamera(n);};
      r.append(add);
      wrap.append(r);
      if(isOpen(n.id))kids.forEach(c=>wrap.append(camRow(c,2)));
    });
    // cameras with no recorder still have to be reachable
    const orphans=cams.filter(c=>!c.nvr||!nvrs.some(n=>n.id===c.nvr));
    if(orphans.length){
      const h=mk('div','note','Not connected to a recorder');
      h.style.padding='4px 12px 2px'; wrap.append(h);
      orphans.forEach(c=>wrap.append(camRow(c,2)));
    }
  }));

  // ---- occluders, nested ----
  pane.append(section('Occluders',boxes.length,()=>pickOccluder(),'sec-occ',wrap=>{
    const walk=(pid,depth)=>{
      childrenOf(pid).forEach(b=>{
        const kids=childrenOf(b.id);
        wrap.append(boxRow(b,depth,kids.length));
        if(kids.length&&isOpen(b.id))walk(b.id,depth+1);
      });
    };
    walk(null,1);
    // drop target for un-parenting
    const root=mk('div','trow');
    root.style.paddingLeft='19px';
    root.append(mk('span','tw',''),mk('span','nm','— drop here to un-parent —'));
    root.querySelector('.nm').style.cssText='color:#5A6678;font-family:var(--mono);font-size:9.5px';
    dropTarget(root,null);
    wrap.append(root);
  }));

  // ---- property boundary ----
  pane.append(row({label:'Property boundary',
    meta:Math.round(polyArea()).toLocaleString()+' sq ft',
    selected:selProp, indent:0, onSelect:()=>select('prop')}));
}

function camRow(c,depth){
  const S=specOf(c);
  const r=row({label:`${c.id} · ${c.name}`, meta:S.model,
    selected:sel===c.id, on:c.on, dot:colC(c), indent:depth,
    onSelect:()=>select('cam',c.id),

function boxRow(b,depth,kidCount){
  const tall=(zmax(b)-zmin(b)).toFixed(1);
  const r=row({label:b.name, meta:tall+' ft'+(b.yaw?` ${Math.round(b.yaw)}°`:''),
    selected:selBox===b.id, on:b.on, indent:depth,

    onTwisty:()=>toggleNode(b.id),
    onSelect:()=>select('box',b.id),
    onEye:()=>{b.on=!b.on;splat=null;render();list();}});
  r.draggable=true;
  r.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.id);e.dataTransfer.effectAllowed='move';});
  dropTarget(r,b.id);
  return r;

// Reparenting by drag. setParent refuses cycles, and the refusal is reported
// rather than silently ignored.
function dropTarget(el,parentId){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop');});
  el.addEventListener('dragleave',()=>el.classList.remove('drop'));
  el.addEventListener('drop',e=>{
    e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
    const id=e.dataTransfer.getData('text/plain');
    const b=boxes.find(v=>v.id===id);
    if(!b||b.id===parentId)return;
    if(!setParent(b,parentId)){ toast('That would nest an occluder inside itself'); return; }
    splat=null; render(); list();
  });
}

function modal(title,build){

// Generic list picker. `cfg.filters` are [label, predicate, defaultOn].
function listPicker(cfg){
  modal(cfg.title,(box,close)=>{
    const bar=mk('div','pbar');
    const search=mk('input','t'); search.placeholder='Search '+cfg.kind+'…'; search.type='search';
    bar.append(search);
    const sortSel=mk('select','t'); sortSel.style.flex='0 0 130px';
    cfg.sorts.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.label;sortSel.append(o);});
    bar.append(sortSel);
    const state=cfg.filters.map(f=>f[2]);
    cfg.filters.forEach((f,i)=>{
      const c=mk('button','chip',f[0]);
      c.setAttribute('aria-pressed',state[i]?'true':'false');
      c.onclick=()=>{state[i]=!state[i];c.setAttribute('aria-pressed',state[i]?'true':'false');draw();};
      bar.append(c);
    });
    box.append(bar);

    const list=mk('div','plist'); box.append(list);
    const foot=mk('div','pfoot');
    const imp=mk('button','act','Import catalog file…');
    imp.onclick=()=>importFile(()=>{draw();list0();});
    const cancel=mk('button','act','Close'); cancel.onclick=close;
    foot.append(imp,cancel); box.append(foot);

    function draw(){
      list.textContent='';
      let rows=cfg.entries();
      const q=search.value.trim().toLowerCase();
      if(q)rows=rows.filter(e=>(`${e.brand} ${e.model} ${e.id}`).toLowerCase().includes(q));
      cfg.filters.forEach((f,i)=>{ if(state[i])rows=rows.filter(f[1]); });
      const s=cfg.sorts[+sortSel.value]; if(s&&s.cmp)rows=rows.slice().sort(s.cmp);
      if(!rows.length){ list.append(cfg.entries().length?mk('div','pempty','Nothing matches those filters.'):emptyCatalogNote(cfg.kind)); return; }
      rows.forEach(e=>{
        const it=mk('div','pitem');
        const b=mk('div','b');
        const t1=mk('div','t1'); t1.innerHTML=`${e.brand} ${e.model}${srcBadge(e)}`;
        b.append(t1, mk('div','t2',cfg.line(e)));
        it.append(b);
        const add=mk('button','act','Add'); add.style.flex='0 0 58px';
        const go=()=>{ cfg.add(e); close(); render(); list0(); };
        add.onclick=e2=>{e2.stopPropagation();go();};
        it.onclick=go;
        it.append(add);
        list.append(it);
      });
    }
    search.oninput=draw; sortSel.onchange=draw;
    draw();
  });
}

             ['PoE',e=>e.poe,false],
             ['Wi-Fi',e=>e.wifi,false],
             ['PTZ',e=>e.ptz,false],
             ['4K+',e=>((e.resolution&&e.resolution.w)||0)>=3840,false]],
    sorts:[{label:'Sort: name',cmp:(a,b)=>(a.brand+a.model).localeCompare(b.brand+b.model)},
           {label:'Sort: resolution',cmp:(a,b)=>((b.resolution||{}).w||0)-((a.resolution||{}).w||0)},

// A field that shows what it inherits until you override it.
function inheritField(lbl,obj,field,options){
  const r=inherit(obj,field);
  const own=obj[field]!==undefined&&obj[field]!==null;
  const s=mk('select','t');
  const opt=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o);return o;};
  opt('','inherit ('+r.v+')');
  options.forEach(v=>opt(v,String(v)));
  s.value=own?String(obj[field]):'';
  if(!own)s.classList.add('inherited');
  s.onchange=()=>{ obj[field]=s.value===''?null:(isNaN(+s.value)?s.value:+s.value); render(); list(); };
  return fld(lbl,s);
}

  p.append(head('Occluder'));
  p.append(text('name',b.name,v=>b.name=v));
  p.append(pick('parent',b.parent||'',
    [['','— none (world) —'],...boxes.filter(o=>o!==b&&!wouldCycle(o,b.id)).map(o=>[o.id,o.name])],
    v=>{ if(!setParent(b,v||null))toast('That would nest an occluder inside itself'); splat=null; }));
  p.append(num('yaw °',b.yaw||0,v=>{b.yaw=v;splat=null;},5));
  p.append(rule());
  p.append(num('x0',b.x0,v=>{b.x0=Math.min(v,b.x1-0.25);splat=null;}));
  p.append(num('y0',b.y0,v=>{b.y0=Math.min(v,b.y1-0.25);splat=null;}));
  p.append(num('x1',b.x1,v=>{b.x1=Math.max(v,b.x0+0.25);splat=null;}));
  p.append(num('y1',b.y1,v=>{b.y1=Math.max(v,b.y0+0.25);splat=null;}));
  if(b.shape==='cyl'||b.shape==='tree'){
    p.append(num('radius ft',b.r||0.5,v=>{b.r=Math.max(0.1,v);splat=null;},0.25));
    if(b.shape==='tree'){
      p.append(num('canopy r',b.canopyR||6,v=>{b.canopyR=Math.max(0.5,v);splat=null;},0.5));
      p.append(num('canopy h',b.canopyH||8,v=>{b.canopyH=Math.max(0.5,v);splat=null;},0.5));
    }
  }
  p.append(rule());
  p.append(head('Heights'));
  const eLbl={N:'N',E:'E',S:'S',W:'W'};
  [['zt','top'],['zb','base']].forEach(([key,word])=>{
    EDGES.forEach(edg=>{
      const cur=(b[key][edg.c[0]]+b[key][edg.c[1]])/2;
      p.append(num(word+' '+eLbl[edg.k],Math.round(cur*100)/100,v=>{
        edg.c.forEach(i=>b[key][i]=v);
        if(key==='zt')b.zt=b.zt.map((z,i)=>Math.max(z,b.zb[i]+.15));
        else b.zb=b.zb.map((z,i)=>Math.min(z,b.zt[i]-.15));
        splat=null;
      },0.25));
    });
  });
  p.append(btnRow(
    btn('Level',()=>{const m=Math.max(...b.zt),n=Math.min(...b.zb);b.zt=[m,m,m,m];b.zb=[n,n,n,n];splat=null;render();list();}),
    btn('Slab base',()=>{const th=Math.max(0.25,b.zt[0]-b.zb[0]);
      b.zb=b.zt.map(v=>Math.round((v-th)*100)/100);splat=null;render();list();})));
  const kids=childrenOf(b.id);
  if(kids.length){
    const n2=mk('p','note',`${kids.length} child occluder${kids.length>1?'s':''} move with this one.`);
    p.append(n2);
  }
  p.append(rule());
  p.append(btnRow(btn('Delete',()=>{
    childrenOf(b.id).forEach(k=>k.parent=b.parent||null);   // don't orphan the subtree
    boxes=boxes.filter(v=>v!==b); splat=null; select(null);
  },'danger')));
}

/* ---------- property boundary ---------- */
function propsBoundary(p){
  p.append(head('Property boundary'));
  const s=mk('div','spec');
  s.innerHTML=`${prop.length} vertices · <b>${Math.round(polyArea()).toLocaleString()} sq ft</b><br>`+
    `drag a vertex · + adds one · shift-click removes`;
  p.append(s);
  p.append(rule());
  const i=mk('input','t'); i.type='number'; i.step=100; i.value=Math.round(polyArea());
  p.append(fld('lot sq ft',i));
  p.append(btnRow(btn('Scale to that area',()=>{
    const target=parseFloat(i.value), cur=polyArea();
    if(!(target>0)||!(cur>0))return;
    const k=Math.sqrt(target/cur);
    const cx0=prop.reduce((a,v)=>a+v[0],0)/prop.length;
    const cy0=prop.reduce((a,v)=>a+v[1],0)/prop.length;
    prop=prop.map(([x,y])=>[Math.round((cx0+(x-cx0)*k)*10)/10,Math.round((cy0+(y-cy0)*k)*10)/10]);
    render();list();toast('Scaled to '+Math.round(polyArea()).toLocaleString()+' sq ft');
  })));
  p.append(btnRow(
    btn('Measured lot',()=>{const {P}=decodeRaw(MEASURED); if(P){prop=P;splat=null;render();list();}}),
    btn('Square',()=>{prop=DEF_PROP();splat=null;render();list();})));
  p.append(btnRow(btn('Fit to structures',()=>{
    const on=boxes.filter(b=>b.on);
    if(!on.length)return;
    const m=8;
    const x0=Math.min(...on.map(b=>b.x0))-m, x1=Math.max(...on.map(b=>b.x1))+m;
    const y0=Math.min(...on.map(b=>b.y0))-m, y1=Math.max(...on.map(b=>b.y1))+m;
    prop=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([a,c])=>[Math.round(a*10)/10,Math.round(c*10)/10]);
    render();list();
  })));
}
/* ---------------- status bar and layer strip ---------------- */
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'—';
function fmtDays(d){
  if(!isFinite(d)||d<=0)return '—';
  if(d<1)return (d*24).toFixed(1)+' h';
  if(d<90)return d.toFixed(1)+' d';
  return (d/30.4).toFixed(1)+' mo';
}
// `stale` dims the figures while the full-resolution pass is still running,
// so a coarse number is never mistaken for the final one.
function paintStats(r,stale){
  const bar=$('status'); if(!bar)return;
  const t=totals();
  bar.classList.toggle('stale',!!stale);
  const cells=[];
  cells.push(['', `<b>${t.nvrs}</b> NVR${t.nvrs===1?'':'s'} · <b>${t.cams}</b> cam${t.cams===1?'':'s'}`]);
  cells.push([t.cams>t.chans?'warn':'', `<b>${t.cams}/${t.chans||'?'}</b> channels`]);
  cells.push(['', priceKnown()?`<b>$${Math.round(t.cost).toLocaleString()}</b>`:'price <b>not set</b>']);
  if(r&&r.nc){
    cells.push(['', `near buildings <b>${pct(r.cc,r.nc)}</b> · face-ID <b>${pct(r.ci,r.nc)}</b>`]);
    cells.push(['', `lot <b>${pct(r.ac,r.n)}</b>`]);
    if(r.anyTour)cells.push(['', `watched <b>${pct(r.dut,r.nc)}</b> of each PT cycle`]);
  } else if(r){
    cells.push(['', 'boundary encloses no open ground']);
  }
  cells.push(['', `<b>${(t.storageGB/1000).toFixed(1)}</b> TB · <b>${t.mbps.toFixed(1)}</b> Mbps`]);
  cells.push(['', `records <b>${fmtDays(t.days)}</b>`]);
  if(opts.night)cells.push(['warn','<b>night</b>']);
  bar.innerHTML=cells.map(([c,h])=>`<span class="cell ${c}">${h}</span>`).join('');
  bar.title='Recording duration assumes continuous recording at the current fps and quality.';
}

// The handful of toggles worth keeping one click away from the stage.

/* ---------------- sidebar resizing ---------------- */
function initSidebar(){
  const side=$('side');
  const px=+localStorage.getItem('sightline.sidebar')||320;
  document.documentElement.style.setProperty('--sidebar',px+'px');
  const savedH=localStorage.getItem('sightline.treeh');
  if(savedH)side.style.setProperty('--treeh',savedH);

  let drag=null;
  $('grip').addEventListener('pointerdown',e=>{
    drag={x:e.clientX,w:side.getBoundingClientRect().width};
    $('grip').setPointerCapture(e.pointerId); e.preventDefault();
  });
  $('grip').addEventListener('pointermove',e=>{
    if(!drag)return;
    const w=clamp(drag.w+(e.clientX-drag.x),210,620);
    document.documentElement.style.setProperty('--sidebar',w+'px');
    render();
  });
  ['pointerup','pointercancel'].forEach(v=>$('grip').addEventListener(v,()=>{
    if(!drag)return;
    drag=null;
    localStorage.setItem('sightline.sidebar',parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar')));
    render();
  }));

  let vdrag=null;
  $('vgrip').addEventListener('pointerdown',e=>{
    vdrag={y:e.clientY,h:$('treepane').getBoundingClientRect().height};
    $('vgrip').setPointerCapture(e.pointerId); e.preventDefault();
  });
  $('vgrip').addEventListener('pointermove',e=>{
    if(!vdrag)return;
    const total=side.getBoundingClientRect().height;
    const h=clamp(vdrag.h+(e.clientY-vdrag.y),80,total-120);
    side.style.setProperty('--treeh',(100*h/total).toFixed(1)+'%');
  });
  ['pointerup','pointercancel'].forEach(v=>$('vgrip').addEventListener(v,()=>{
    if(!vdrag)return;
    vdrag=null;
    localStorage.setItem('sightline.treeh',side.style.getPropertyValue('--treeh'));
  }));
}
/* ---------------- sidebar refresh ---------------- */

// how much of the nominal arc is actually usable
function lowVis(c){
  const S=specOf(c), tz=targetZ();
  const far=detectFt(S);
  if(!(far>0))return 'no usable range in these lighting conditions';
  let free=0,n=0;
  for(let o=-S.fovH/2;o<=S.fovH/2;o+=3){
    n++;
    const aa=rad(c.a+o);
    let any=false;
    for(let d=6;d<=far;d+=3){
      if(quality(c,c.x+d*Math.cos(aa),c.y+d*Math.sin(aa),tz)){any=true;break;}
    }
    if(any)free++;
  }
  const p=Math.round(100*free/n);
  return p<80?`only ${p}% of its arc reaches anything`:'';
}
/* ---------------- code ---------------- */
function encode(){
  const L=['PLAN v3 · feet · x=east y=south · a=bearing (0=east,90=south) · z=mount height · t=down-tilt'];
  cams.forEach(c=>L.push(`CAM ${c.id} | ${c.on?'ON ':'OFF'} | ${(c.lens||'ptz').toUpperCase()} | x ${c.x} | y ${c.y} | z ${c.z} | a ${c.a} | t ${c.t} | ${c.name}`));
  cams.forEach(c=>{ if(c.tour&&c.tour.length)
    L.push(`TOUR ${c.id} | home ${c.hd||20} | `+c.tour.map(k=>`${k.a},${k.t},${k.d}`).join(' | ')); });
  L.push('PROP '+prop.map(v=>v.join(',')).join(' | '));
  L.push(`FENCE | ${fence.on?'ON':'OFF'} | h ${fence.h}`);
  boxes.forEach(b=>L.push(`BOX ${b.id} | ${b.on?'ON ':'OFF'} | x0 ${b.x0} | y0 ${b.y0} | x1 ${b.x1} | y1 ${b.y1} | base ${b.zb.join('/')} | top ${b.zt.join('/')} | ${b.name}`));
  return L.join('\n');
}
function decodeRaw(s){
  const C=[],B=[],TR=[]; let P=null;
  s.split('\n').forEach(ln=>{
    const p=ln.split('|').map(v=>v.trim());
    const g=t=>{const f=p.find(v=>v.startsWith(t+' ')); return f?parseFloat(f.slice(t.length+1)):NaN;};
    if(/^FENCE/i.test(p[0])){
      const hh=p.find(v=>/^h /i.test(v));
      fence={on:!/OFF/i.test(ln),h:hh?parseFloat(hh.slice(2)):8};
      return;
    }
    if(/^PROP/i.test(p[0])){
      const raw=ln.replace(/^\s*PROP\s*/i,'').split('|');
      const v=raw.map(t=>t.trim().split(',').map(parseFloat))
                 .filter(a=>a.length===2&&!a.some(Number.isNaN));
      if(v.length>=3)P=v;
      return;
    }
    if(/^TOUR /i.test(p[0])){
      const id=p[0].slice(5).trim();
      const hm=p.find(v=>/^home /i.test(v));
      const kf=p.slice(1).filter(v=>/^-?[\d.]+\s*,/.test(v))
        .map(v=>v.split(',').map(parseFloat))
        .filter(a=>a.length===3&&!a.some(Number.isNaN))
        .map(([a,t,d])=>({a,t,d}));
      TR.push({id,hd:hm?parseFloat(hm.slice(5)):20,tour:kf});
      return;
    }
    if(/^CAM /i.test(p[0])){
      const o={id:p[0].slice(4).trim(),on:/^ON/i.test(p[1]),
        lens:/DUO/i.test(p[2])?'duo':'ptz',
        x:g('x'),y:g('y'),z:g('z'),a:g('a'),t:g('t'),
        name:p[p.length-1]||p[0],note:''};
      if(Number.isNaN(o.z))o.z=10.5; if(Number.isNaN(o.t))o.t=15;
      if(![o.x,o.y,o.a].some(Number.isNaN))C.push(o);
    } else if(/^BOX /i.test(p[0])){
      const quad=(tag,fb)=>{
        const f=p.find(v=>new RegExp('^'+tag+' ','i').test(v));
        if(f){const a=f.slice(tag.length+1).split('/').map(parseFloat);
          if(a.length===4&&!a.some(Number.isNaN))return a;
          if(a.length===1&&!Number.isNaN(a[0]))return [a[0],a[0],a[0],a[0]];}
        const n=g(fb); return Number.isNaN(n)?null:[n,n,n,n];
      };
      const zt=quad('top','z1'), zb=quad('base','z0');
      const o={id:p[0].slice(4).trim(),on:/^ON/i.test(p[1]),
        x0:g('x0'),y0:g('y0'),x1:g('x1'),y1:g('y1'),zb,zt,
        name:p[p.length-1]||p[0]};
      if(zt&&zb&&![o.x0,o.y0,o.x1,o.y1].some(Number.isNaN))B.push(o);
    }
  });
  TR.forEach(t=>{const c=C.find(v=>v.id===t.id); if(c){c.hd=t.hd;c.tour=t.tour;}});
  return {C,B,P};
}

const decode=decodeRaw;
/* ---------------- presets ---------------- */
// Camera positions only. Swapping a preset keeps the structures and the
// recorder, and now also keeps whatever catalog entry each camera came from -
// a preset is a layout, not a shopping list.
const PRESET_LABEL={yours:'7 PTZ',duo2:'2 Duo + 4 E1',duo4:'4 Duo mid-wall'};
const PRESETS={
 yours:[['ptz',-1.2,11.3,8.5,185],['ptz',-0.4,1.5,10.5,143],['ptz',25.7,2.2,8,329],
        ['ptz',26,23.5,10.5,329],['ptz',1.7,25,10.5,48],['ptz',3.4,-0.6,11,316],['ptz',22.2,-0.8,11,224]],
 duo2 :[['duo',12.5,-1,11,270],['duo',12.5,26,11,90],['ptz',-6.5,11,8.5,126],
        ['ptz',33.5,3.5,8,312],['ptz',-1.5,-1.5,10.5,135],['ptz',26.5,26.5,10.5,309]],
 duo4 :[['duo',12.5,-1,11,270],['duo',26,12.5,11,0],['duo',12.5,26,11,90],['duo',-1,12.5,11,180]]
};
function applyPreset(k){
  const home=nvrs[0]?nvrs[0].id:null;
  cams=PRESETS[k].map(([lens,x,y,z,a],i)=>migrateCam(
    {id:'C'+(i+1),lens,x,y,z,a,t:15,name:LEGACY_SPEC[LEGACY_KEY[lens]].model,
     note:'',on:true,nvr:home}));
  select(null);
  toast('Cameras swapped — structures kept');
}
/* ---------------- PT circuit animation ---------------- */
const MOVE=1.5;                       // seconds to swing between stops
let speed=4;                          // playback multiplier
let playing=false, t0=0, snap=null, lastFrame=0;
function timeline(c){
  const S=stops(c), o=order(c), seg=[];
  o.forEach((idx,j)=>{
    const k=S[idx], n=S[o[(j+1)%o.length]];
    seg.push({kind:'hold',a:k.a,t:k.t,dur:k.d||8});
    seg.push({kind:'move',a0:k.a,t0:k.t,a1:n.a,t1:n.t,dur:MOVE});
  });
  return seg;
}
const shortest=(a,b2)=>{let d=((b2-a+540)%360)-180;return a+d;};
function poseAt(c,tau){
  const seg=timeline(c), tot=seg.reduce((s,k)=>s+k.dur,0);
  let u=tot?tau%tot:0;
  for(const k of seg){
    if(u<k.dur){
      if(k.kind==='hold')return {a:k.a,t:k.t};
      const f=u/k.dur, e=f*f*(3-2*f);            // ease in-out
      return {a:norm(k.a0+(shortest(k.a0,k.a1)-k.a0)*e), t:k.t0+(k.t1-k.t0)*e};
    }
    u-=k.dur;
  }
  return {a:c.a,t:c.t};
}
function frame(ts){
  if(!playing)return;
  const tau=(ts-t0)/1000*speed;
  cams.forEach(c=>{
    if((c.lens||'ptz')!=='ptz'||!c.tour||!c.tour.length)return;
    const base=snap[c.id]; if(!base)return;
    const saveA=c.a,saveT=c.t; c.a=base.a; c.t=base.t;
    const q=poseAt(c,tau); c.a=Math.round(q.a*10)/10; c.t=Math.round(q.t*10)/10;
  });
  if(ts-lastFrame>90){ lastFrame=ts; coarse=true; render(); }
  requestAnimationFrame(frame);
}
function togglePlay(){
  playing=!playing;
  $('bPlay').setAttribute('aria-pressed',playing);
  $('bPlay').textContent=playing?'❚❚ CIRCUIT':'▶ CIRCUIT';
  if(playing){
    if(!cams.some(c=>c.tour&&c.tour.length)){toast('No PT circuits defined');playing=false;
      $('bPlay').textContent='▶ CIRCUIT';$('bPlay').setAttribute('aria-pressed',false);return;}
    snap={}; cams.forEach(c=>snap[c.id]={a:c.a,t:c.t});
    t0=performance.now(); lastFrame=0;
    requestAnimationFrame(frame);
  } else {
    if(snap)cams.forEach(c=>{const b2=snap[c.id]; if(b2){c.a=b2.a;c.t=b2.t;}});
    snap=null; coarse=false; render(); list();
  }
}
$('bPlay').onclick=togglePlay;
$('bSpeed').onclick=()=>{speed=speed===1?4:speed===4?10:1;$('bSpeed').textContent=speed+'×';};

let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900);}
addEventListener('keydown',ev=>{
  const t=ev.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||ev.metaKey||ev.ctrlKey)return;
  const k=ev.key.toLowerCase();
  if(k==='2'){$('m2d').click();}
  else if(k==='3'){$('m3d').click();}
  else if(k==='4'){$('mpov').click();}
  else if(k==='5'){$('msplit').click();}
  else if(k===' '){togglePlay();}
  else if(k==='f'){resetView();}
  else if(k==='b'){const {P}=decodeRaw(MEASURED); if(P){prop=P;splat=null;render();list();
    toast('Boundary restored — '+Math.round(polyArea()).toLocaleString()+' sq ft');}}
  else if(k==='e'){selProp=!selProp;sel=null;selBox=null;render();list();}
  else if(k==='s'){opts.splat=!opts.splat;render();list();}
  else if(k==='v'){opts.frus=!opts.frus;render();list();}
  else if(k==='o'){opts.occ=!opts.occ;splat=null;render();list();}
  else if(k==='g'){opts.grid=!opts.grid;render();}
  else if(k==='n'){opts.night=!opts.night;clearSpecCache();splat=null;render();list();
    toast(opts.night?'Night: range limited by IR and floodlight':'Day');}
  else if(k==='escape'){sel=null;selBox=null;selProp=false;render();list();}
  else return;
  ev.preventDefault();
});
addEventListener('resize',()=>render());

/* ---------------- boot ---------------- */
// Order matters. The project's own catalog snapshot is seeded first so every
// camera resolves to a spec before anything asks for coverage; the network
// catalog is enrichment that arrives later, or never.
function boot(){
  initSidebar();
  restoreUserCatalog();
  if(!restore()){
    // No saved project: the default house, its porches and deck, a square
    // boundary and one recorder.
    loadMeasured();
  } else {
    CAT.seedFromProject(projectSnapshot());
  }
  render(); list();
  CAT.fetchCatalog().then(()=>{
    clearSpecCache();
    render(); list();
  });
}
boot();
