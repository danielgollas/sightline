<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sightline — camera coverage planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1319;--ink2:#161C25;--line:#232C38;--line2:#2E3947;
  --bone:#E9E5DB;--dim:#8A9099;--warn:#E08A82;--good:#93BF63;
  --sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sidebar:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

/* three regions: sidebar | stage, with a status bar across the bottom */
.wrap{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) 26px;height:100vh}
.side{background:var(--ink2);border-right:1px solid var(--line);
  display:grid;grid-template-rows:minmax(80px,var(--treeh,42%)) 5px minmax(0,1fr);overflow:hidden;position:relative}
#treepane{overflow-y:auto;padding:8px 0 10px}
#propspane{overflow-y:auto;padding:10px 12px 18px;border-top:1px solid var(--line)}
.vgrip{cursor:row-resize;background:transparent}
.vgrip:hover{background:var(--line2)}
.grip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:9}
.grip:hover{background:var(--line2)}

.stage{position:relative;min-width:0;background:radial-gradient(ellipse at 45% 40%,#151B24 0%,var(--ink) 72%);overflow:hidden}
.stage.split #cov,.stage.split #plan,.stage.split #view3d{width:50%}
.stage.split #povgrid{left:50%;width:50%;padding:52px 10px 10px;border-left:1px solid var(--line)}
#cov,#plan,#view3d,#gl3d{position:absolute;inset:0;width:100%;height:100%}
/* One z-order for every mode: the GL render underneath, then the coverage
   raster, then the plan diagram, then the 3D handle overlay. The plan view is
   a render now, so gl3d has to sit below the diagram rather than above it. */
#gl3d{z-index:1}
.stage.split #gl3d{width:50%}
#povgrid{position:absolute;inset:0;z-index:4;display:none;grid-template-columns:1fr 1fr;
  gap:8px;padding:52px 12px 12px;overflow-y:auto;align-content:start;grid-auto-rows:min-content}
.povcell{position:relative;background:#0B0F14;border:1px solid var(--line);border-radius:3px;
  overflow:hidden;cursor:zoom-in;aspect-ratio:16/10;height:auto;align-self:start}
.povcell.wide{aspect-ratio:32/10;grid-column:span 2}
#povgrid.one .povcell.wide{grid-column:span 1}
/* fullscreen: one cell, centred, grown to the largest size that still fits
   the stage. A camera frame has a fixed aspect (the sensor's), so filling
   both axes is not on offer - filling one and centring on the other is. */
#povgrid.max{align-content:center}
/* An explicit width, not margin:auto - the canvas and the SVG inside a cell
   are both absolutely positioned, so a shrink-to-fit cell measures zero. */
#povgrid.max .povcell{justify-self:center;
  width:min(100%,calc((100vh - 160px) * var(--ar,1.78)))}
/* the GL canvas renders the scene; the SVG overlays handles and labels on top.
   Direct child only: the icons inside the zoom button and the drag hint are
   also SVGs, and stretching those to fill the cell collapses them to nothing. */
.povcell > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.povcell > svg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
.dpad{position:absolute;right:8px;bottom:8px;display:grid;
  grid-template-columns:repeat(3,24px);grid-template-rows:repeat(3,24px);gap:2px;
  opacity:.45;transition:opacity .15s;z-index:2}
.povcell:hover .dpad{opacity:1}
.dpad button{background:rgba(15,19,25,.85);border:1px solid var(--line2);color:var(--bone);
  font-size:11px;line-height:1;border-radius:2px;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.dpad button:hover{background:#2A333F;border-color:#5A6678}
.dpad button:active{background:#3A4553}
.dpad button:focus-visible{outline:2px solid var(--bone);outline-offset:1px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .c{grid-area:2/2;font-size:9px}
.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
/* the camera view is a drag surface: drag to pan and tilt */
.povcell{cursor:move}
.povcell.dragging{cursor:grabbing}
/* tile / fullscreen toggle */
.zoombtn{position:absolute;right:8px;top:8px;width:26px;height:26px;z-index:3;
  background:rgba(15,19,25,.85);border:1px solid var(--line2);color:var(--bone);
  border-radius:2px;cursor:pointer;line-height:0;padding:0;
  opacity:.45;transition:opacity .15s;display:flex;align-items:center;justify-content:center}
.povcell:hover .zoombtn{opacity:1}
.zoombtn:hover{background:#2A333F;border-color:#5A6678}
.zoombtn:focus-visible{outline:2px solid var(--bone);outline-offset:1px}
/* quiet hint that the view itself is draggable */
.panhint{position:absolute;right:40px;top:11px;z-index:3;color:var(--bone);
  opacity:.3;pointer-events:none;line-height:0;transition:opacity .15s}
.povcell:hover .panhint{opacity:.6}
#bPlay[aria-pressed="true"]{color:var(--good);border-color:#4E6B3A}
/* view3d is the SVG handle overlay and must sit ABOVE the GL canvas (z-index 3),
   and must be transparent or it paints over the whole render. The gradient is
   the pre-WebGL sky, kept only as a fallback and defeated by the !important
   above it - do not "tidy" that away without checking 3D still draws. */
#cov{z-index:2}#plan{z-index:3}#view3d{z-index:4;background:none !important;background:linear-gradient(#3F70A4 0%,#7FAAD2 45%,#0F1319 46%,#0F1319 100%)}
svg{display:block;touch-action:none}

.modes{position:absolute;top:14px;right:16px;z-index:6;display:flex;gap:4px}
.modes button,.layers button{background:#161C25;border:1px solid var(--line2);color:var(--dim);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:6px 11px;border-radius:2px;cursor:pointer}
.modes button[aria-pressed="true"],.layers button[aria-pressed="true"]{color:var(--bone);border-color:#5A6678;background:#212A35}
.modes button:focus-visible,.layers button:focus-visible,button.act:focus-visible{outline:2px solid var(--bone);outline-offset:1px}
.layers{position:absolute;top:14px;left:16px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;max-width:58%}
.layers button{padding:5px 8px;letter-spacing:.06em}
.hint{position:absolute;left:16px;bottom:12px;z-index:6;font-family:var(--mono);font-size:10px;
  color:var(--dim);line-height:1.7;pointer-events:none}
.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:7;background:#212A35;
  border:1px solid var(--line2);padding:7px 13px;border-radius:3px;font-family:var(--mono);font-size:10.5px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---- status bar ---- */
.status{grid-column:1/-1;background:#121820;border-top:1px solid var(--line);
  display:flex;align-items:center;font-family:var(--mono);font-size:10px;color:var(--dim);
  padding:0 10px;overflow-x:auto;white-space:nowrap}
.status .cell{padding:0 11px;border-right:1px solid var(--line);line-height:25px;flex:none}
.status .cell:last-child{border-right:none}
.status b{color:var(--bone);font-weight:500}
.status .warn b{color:var(--warn)}
.status.stale b{color:var(--dim)}

/* ---- tree ---- */
.tsec{margin-bottom:2px}
.thead{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.thead:hover{background:#1B222C;color:var(--bone)}
.thead .cnt{color:#5A6678;letter-spacing:0}
.tadd{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--dim);
  width:17px;height:17px;line-height:1;border-radius:2px;cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none}
.tadd:hover{color:var(--bone);border-color:#5A6678;background:#212A35}
.trow{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 0;cursor:pointer;font-size:12px;position:relative}
.trow:hover{background:#1B222C}
.trow.sel{background:#222C38}
.trow.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--dot,var(--bone))}
.trow .tw{width:12px;flex:none;color:#5A6678;font-size:9px;text-align:center}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .mt{font-family:var(--mono);font-size:9px;color:#6E7783;flex:none}
.trow .eye{background:none;border:none;color:#5A6678;cursor:pointer;font-size:11px;padding:0 2px}
.trow .eye:hover{color:var(--bone)}
.trow.off .nm{color:#5F6772}
.trow.drop{outline:1px dashed var(--bone);outline-offset:-2px}
.trow .dot{width:6px;height:6px;border-radius:50%;flex:none}

/* ---- property editor ---- */
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
.divider{height:1px;background:var(--line);margin:14px 0}
.fld{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.fld label{font-family:var(--mono);font-size:9.5px;color:var(--dim);width:64px;flex:none}
input.t,select.t{flex:1;min-width:0;background:#0F1319;border:1px solid var(--line2);color:var(--bone);
  font-family:var(--mono);font-size:10.5px;padding:5px 6px;border-radius:2px}
input.t:focus,select.t:focus{outline:1px solid var(--bone);border-color:var(--bone)}
input.t.inherited{color:#6E7783;font-style:italic}
.row{display:flex;gap:5px;margin-bottom:5px}
button.act{background:#0F1319;border:1px solid var(--line2);color:var(--bone);font-family:var(--mono);
  font-size:10px;letter-spacing:.05em;padding:6px 8px;border-radius:2px;cursor:pointer;flex:1}
button.act:hover{background:#212A35;border-color:#455063}
button.danger:hover{border-color:#B4564F;color:var(--warn)}
.layer{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:12px}
.layer input{accent-color:var(--bone);width:13px;height:13px;cursor:pointer}
.note{font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.6;margin-top:6px}
.note b{color:var(--bone);font-weight:500}
.spec{font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1.75}
.spec b{color:var(--bone);font-weight:500}
.badge{font-family:var(--mono);font-size:8.5px;padding:1px 4px;border:1px solid var(--line2);
  border-radius:2px;color:var(--dim);margin-left:5px}
textarea{width:100%;height:70px;background:#0F1319;border:1px solid var(--line2);color:var(--bone);
  font-family:var(--mono);font-size:9.5px;padding:6px;border-radius:2px;resize:vertical;line-height:1.5}
a.link{color:#7FAAD2;font-family:var(--mono);font-size:9.5px;text-decoration:none}
a.link:hover{text-decoration:underline}

/* ---- add menu ---- */
.scrim{position:fixed;inset:0;background:rgba(9,12,16,.66);z-index:20;display:flex;
  align-items:center;justify-content:center}
.picker{background:var(--ink2);border:1px solid var(--line2);border-radius:4px;width:min(760px,92vw);
  max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.picker h3{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  padding:13px 15px;border-bottom:1px solid var(--line)}
.pbar{display:flex;gap:6px;padding:10px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.pbar input.t{flex:1 1 200px}
.chip{font-family:var(--mono);font-size:9.5px;padding:4px 8px;border:1px solid var(--line2);
  border-radius:11px;color:var(--dim);cursor:pointer;background:none}
.chip[aria-pressed="true"]{color:var(--bone);border-color:#5A6678;background:#212A35}
.plist{overflow-y:auto;padding:6px 0}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 15px;cursor:pointer;border-bottom:1px solid #1A212A}
.pitem:hover{background:#1B222C}
.pitem .b{flex:1;min-width:0}
.pitem .t1{font-size:12.5px;font-weight:500}
.pitem .t2{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.5}
.pitem .incompat{color:var(--warn)}
.pempty{padding:26px 15px;font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.9;text-align:center}
.pfoot{padding:10px 15px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.pfoot button.act{flex:0 0 auto;padding:6px 14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:14px}
.pcard{border:1px solid var(--line2);border-radius:3px;padding:12px 10px;cursor:pointer;text-align:center}
.pcard:hover{background:#212A35;border-color:#5A6678}
.pcard .t1{font-size:12px;margin-bottom:4px}
.pcard .t2{font-family:var(--mono);font-size:9px;color:var(--dim)}

@media (max-width:840px){
  .wrap{grid-template-columns:1fr;grid-template-rows:38vh minmax(0,1fr) 26px}
  .side{border-right:none;border-bottom:1px solid var(--line)}
  .grip{display:none}.hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side" id="side">
    <div id="treepane"></div>
    <div class="vgrip" id="vgrip"></div>
    <div id="propspane"></div>
    <div class="grip" id="grip"></div>
  </aside>

  <div class="stage" id="stage">
    <canvas id="cov"></canvas>
    <canvas id="gl3d" style="display:none"></canvas>
    <svg id="plan" preserveAspectRatio="xMidYMid meet"></svg>
    <svg id="view3d" preserveAspectRatio="xMidYMid meet" style="display:none"></svg>
    <div id="povgrid"></div>
    <div class="layers" id="layers"></div>
    <div class="modes">
      <button id="m2d" aria-pressed="true">PLAN</button>
      <button id="m3d" aria-pressed="false">3D</button>
      <button id="mpov" aria-pressed="false">CAMS</button>
      <button id="msplit" aria-pressed="false">SPLIT</button>
      <button id="bPlay" title="Play the PT circuit">▶ CIRCUIT</button>
      <button id="bSpeed" title="Playback speed">4×</button>
    </div>
    <div class="hint" id="hint">Scroll to zoom · drag background to pan · drag box corners to resize, ✛ to move it</div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
"use strict";

/*MODULES*/
</script>
</body>
</html>
